name: Build ANGLE

# Deliberately not on main and deliberately without a release step: this builds ANGLE
# for measurement and leaves the result as a run artifact.
on:
  push:
    branches:
      - angle-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          # The ANGLE checkout alone is larger than a runner's spare space
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pkg-resources curl xz-utils

      - name: Build ANGLE
        run: |
          chmod +x angle.sh
          ./angle.sh ${{ matrix.abi }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: angle-${{ matrix.abi }}
          path: output/angle/lib/${{ matrix.abi }}
          if-no-files-found: error
